<!DOCTYPE html>
<html lang="es">
<head>
<base target="_top">
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Seguimientos · CHP</title>
<!--
  Seguimientos CHP. Un solo archivo para Google Apps Script (HtmlService): HTML + CSS + JS sin compilar.
  Punto de partida: docs/diseno/handoff-etapa1/referencia/Index.html. Formas de datos: MAPEO-SERVIDOR.md.
  Los colores viven SOLO en :root y html[data-modo="oscuro"] (lo comprueba test/ui.test.js).
  Abierto como archivo usa el DEMO del final, con las formas reales del servidor y datos inventados.
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Geist:wght@400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<script src="https://unpkg.com/@phosphor-icons/web@2.1.1"></script>
<style>
:root{
  --bg:#F4F5F7;--side:#FFFFFF;--surface:#FFFFFF;--surface-2:#F8F9FB;--col:#ECEEF2;--line:#E4E6EB;--line-2:#CDD1D9;
  --ink:#15171C;--soft:#41464F;--muted:#636976;
  --accent:#8C1D18;--accent-hover:#741612;--accent-ink:#FFFFFF;--accent-soft:#F7E9E8;--accent-ring:rgb(140 29 24 / .28);
  --good:#1E7A4C;--good-soft:#E6F4EC;--warn:#985B00;--warn-soft:#FBF0DE;--info:#2F5BD3;--info-soft:#E8EEFC;
  --w1:#7A1A15;--w2:#B8433B;--w3:#DA857D;--w4:#F0C2BC;
  --velo:rgb(21 23 28 / .32);--skel:#E4E6EB;--skel-2:#F1F2F5;--toast:#1B1E25;--toast-ink:#F4F5F7;
  --shadow:0 1px 2px rgb(21 23 28 / .06),0 4px 14px rgb(21 23 28 / .05);--shadow-lg:-24px 0 64px rgb(21 23 28 / .14);
  --ease-out:cubic-bezier(.23,1,.32,1);--ease-in-out:cubic-bezier(.77,0,.175,1);--ease-drawer:cubic-bezier(.32,.72,0,1);
  --r:12px;--r-s:8px;--mono:'Geist Mono',ui-monospace,monospace;color-scheme:light
}
html[data-modo="oscuro"]{
  --bg:#0E1015;--side:#12151B;--surface:#171B22;--surface-2:#1D222B;--col:#13171D;--line:#272D38;--line-2:#3A4250;
  --ink:#ECEEF1;--soft:#C3C8D1;--muted:#98A0AD;
  --accent:#EC7B71;--accent-hover:#F39489;--accent-ink:#1A0908;--accent-soft:#2E1816;--accent-ring:rgb(236 123 113 / .35);
  --good:#5CC98F;--good-soft:#132A1F;--warn:#E7A94B;--warn-soft:#2D2312;--info:#8AABFF;--info-soft:#18213A;
  --w1:#EC7B71;--w2:#B85A52;--w3:#844640;--w4:#4E2C29;
  --velo:rgb(4 5 8 / .6);--skel:#1F242D;--skel-2:#2A303B;--toast:#ECEEF1;--toast-ink:#12151B;
  --shadow:0 1px 0 rgb(255 255 255 / .03) inset,0 6px 20px rgb(4 5 8 / .35);--shadow-lg:-24px 0 64px rgb(4 5 8 / .5);color-scheme:dark
}
*{box-sizing:border-box}
html,body{margin:0}
body{font-family:'Geist',sans-serif;font-size:14px;line-height:1.45;background:var(--bg);color:var(--ink);-webkit-font-smoothing:antialiased;transition:background-color .3s ease,color .3s ease}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
a{color:var(--accent)}a:hover{color:var(--accent-hover)}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent-soft);color:var(--ink)}
.mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
[hidden]{display:none!important}

/* Estructura */
.app{display:flex;min-height:100vh}
.side{width:232px;flex:0 0 232px;background:var(--side);border-right:1px solid var(--line);padding:22px 14px 16px;display:flex;flex-direction:column;gap:26px;position:sticky;top:0;height:100vh;view-transition-name:menu}
.marca{display:flex;align-items:center;gap:10px;padding:0 6px}
.logo{width:36px;height:36px;flex:0 0 36px;border-radius:10px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12.5px;letter-spacing:.02em}
.logo.chico{width:32px;height:32px;flex-basis:32px;font-size:11px}
.marca b{display:block;font-size:15px;font-weight:600;letter-spacing:-.01em}
.marca small{display:block;font-size:11.5px;color:var(--muted);line-height:1.3}
.menu{display:flex;flex-direction:column;gap:2px}
/* El menú son botones: con <base target="_top"> un href="#…" navegaría la ventana de arriba. */
.menu button{display:flex;align-items:center;gap:10px;width:100%;height:44px;padding:0 12px;border:0;border-radius:var(--r-s);background:transparent;color:var(--soft);font-weight:500;text-align:left;transition:background-color .15s ease,color .15s ease}
.menu button i{font-size:18px}
.menu button:hover{background:var(--surface-2);color:var(--ink)}
.menu button[aria-current="page"]{background:var(--accent-soft);color:var(--accent)}
.pie{margin-top:auto;display:flex;flex-direction:column;gap:8px}
.pie label{display:flex;flex-direction:column;gap:6px;font-size:12px;color:var(--muted);padding:0 2px}
.ctl{height:44px;padding:0 10px;border:1px solid var(--line);border-radius:var(--r-s);background:var(--surface);color:var(--ink);font-weight:500;font-size:14px}
.ghost{display:flex;align-items:center;gap:10px;height:44px;padding:0 12px;border:0;border-radius:var(--r-s);background:transparent;color:var(--soft);font-weight:500;transition:background-color .15s ease}
.ghost:hover{background:var(--surface-2);color:var(--ink)}
.cuerpo{flex:1;min-width:0;display:flex;flex-direction:column}
.topmovil{display:none;position:sticky;top:0;z-index:20;align-items:center;gap:10px;padding:8px 14px;background:var(--side);border-bottom:1px solid var(--line)}
.topmovil .js-usuario{margin-left:auto;min-width:0;max-width:150px}
.topmovil .js-tema{width:44px;flex:0 0 44px;padding:0;display:grid;place-items:center;font-size:18px}
.navmovil{display:none;position:fixed;left:0;right:0;bottom:0;z-index:30;grid-template-columns:repeat(4,1fr);height:64px;background:var(--side);border-top:1px solid var(--line);view-transition-name:menu-movil}
.navmovil button{display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;min-width:0;padding:0;border:0;background:transparent;font-size:11.5px;font-weight:500;color:var(--muted)}
.navmovil button i{font-size:21px}
.navmovil button[aria-current="page"]{color:var(--accent)}
main{padding:28px 32px 56px;flex:1;min-width:0;width:100%;max-width:1680px}
h1{margin:0;font-size:28px;font-weight:600;letter-spacing:-.025em;line-height:1.15}
.sub{margin:4px 0 0;color:var(--muted)}
.vista{animation:vista .24s var(--ease-out)}
/* Con View Transitions la entrada la anima ::view-transition-new(root): la vista no se anima dos veces. */
html.con-vt .vista{animation:none}
@keyframes vista{from{opacity:0;transform:translateY(8px)}}
.cargando{margin:22px 0 0;color:var(--muted)}

/* Segmentado con pastilla deslizante (la mide pastilla()) */
.seg{position:relative;display:inline-flex;padding:3px;background:var(--surface);border:1px solid var(--line);border-radius:999px;max-width:100%;overflow-x:auto;scrollbar-width:none}
.seg .pastilla{position:absolute;top:3px;bottom:3px;left:0;border-radius:999px;background:var(--accent);transition:transform .25s var(--ease-in-out),width .25s var(--ease-in-out)}
.seg button{position:relative;z-index:1;flex:0 0 auto;height:40px;padding:0 14px;border:0;border-radius:999px;background:transparent;color:var(--soft);font-weight:500;font-size:13.5px;white-space:nowrap;display:inline-flex;align-items:center;gap:7px;transition:color .2s ease}
.seg button:hover{color:var(--ink)}
.seg button[aria-pressed="true"],.seg button[aria-selected="true"]{color:var(--accent-ink)}
.seg .n{font-family:var(--mono);font-size:12px;color:var(--muted);transition:color .2s ease}
.seg button[aria-pressed="true"] .n{color:var(--accent-ink)}

/* Aviso (transición y no keyframes, para poder interrumpirlo) */
.aviso{position:fixed;left:50%;bottom:24px;transform:translate(-50%,16px);opacity:0;pointer-events:none;transition:transform .3s var(--ease-out),opacity .3s ease;z-index:60;display:flex;align-items:center;gap:10px;width:max-content;max-width:calc(100% - 28px);padding:6px 6px 6px 16px;min-height:44px;background:var(--toast);color:var(--toast-ink);border-radius:10px;box-shadow:var(--shadow);font-weight:500}
.aviso.ver{transform:translate(-50%,0);opacity:1;pointer-events:auto}
.aviso button{height:44px;padding:0 12px;border:0;background:transparent;color:var(--toast-ink);font-weight:600;text-decoration:underline;text-underline-offset:3px}

/* Responsivo */
@media (max-width:760px){
  .side{display:none}.topmovil{display:flex}.navmovil{display:grid}
  main{padding:18px 14px 96px}h1{font-size:23px}
  .aviso{bottom:80px}
}
@view-transition{navigation:auto}
::view-transition-old(root),::view-transition-new(root){animation-duration:.22s;animation-timing-function:cubic-bezier(.23,1,.32,1)}
::view-transition-new(root){animation-name:vista}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{transition-duration:1ms!important;animation-duration:1ms!important;animation-iteration-count:1!important}::view-transition-group(*),::view-transition-old(*),::view-transition-new(*){animation:none!important}}
</style>
</head>
<body>
<div class="app">
  <aside class="side">
    <div class="marca"><span class="logo">CHP</span><span><b>Seguimientos</b><small>Centro Hematológico del Perú</small></span></div>
    <nav class="menu" aria-label="Secciones">
      <button type="button" data-sec="tablero"><i class="ph ph-kanban"></i>Tablero</button>
      <button type="button" data-sec="registro"><i class="ph ph-note-pencil"></i>Registro</button>
      <button type="button" data-sec="pacientes"><i class="ph ph-users-three"></i>Pacientes</button>
      <button type="button" data-sec="indicadores"><i class="ph ph-chart-line-up"></i>Indicadores</button>
    </nav>
    <div class="pie">
      <label>¿Quién es usted?<select class="ctl js-usuario" id="usuario"></select></label>
      <button type="button" class="ghost js-tema"><i class="ph ph-moon"></i><span>Modo oscuro</span></button>
    </div>
  </aside>
  <div class="cuerpo">
    <header class="topmovil">
      <span class="logo chico">CHP</span><b>Seguimientos</b>
      <select class="ctl js-usuario" id="usuario-movil" aria-label="¿Quién es usted?"></select>
      <button type="button" class="ctl js-tema" aria-label="Cambiar entre modo claro y oscuro"><i class="ph ph-moon"></i></button>
    </header>
    <main id="vista">
      <section class="vista" id="v-tablero">
        <h1 id="saludo">Buenos días</h1>
        <p class="cargando" role="status">Cargando…</p>
      </section>
      <section class="vista" id="v-registro" hidden>
        <h1>Registro</h1>
        <p class="sub">Lo que indica el doctor: procedimientos, tratamientos y altas médicas.</p>
        <p class="cargando" role="status">Cargando…</p>
      </section>
      <section class="vista" id="v-pacientes" hidden>
        <h1>Pacientes</h1>
        <p class="cargando" role="status">Cargando…</p>
      </section>
      <section class="vista" id="v-indicadores" hidden>
        <h1>Indicadores</h1>
        <p class="cargando" role="status">Cargando…</p>
      </section>
    </main>
  </div>
</div>
<nav class="navmovil" aria-label="Secciones">
  <button type="button" data-sec="tablero"><i class="ph ph-kanban"></i>Tablero</button>
  <button type="button" data-sec="registro"><i class="ph ph-note-pencil"></i>Registro</button>
  <button type="button" data-sec="pacientes"><i class="ph ph-users-three"></i>Pacientes</button>
  <button type="button" data-sec="indicadores"><i class="ph ph-chart-line-up"></i>Indicadores</button>
</nav>
<div class="aviso" id="aviso" role="status" aria-live="polite"><span></span><button type="button" hidden></button></div>

<script>
/* ============ Utilidades ============ */
const $ = (s, r) => (r || document).querySelector(s);
const $$ = (s, r) => Array.from((r || document).querySelectorAll(s));
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
/** Sin tildes y en MAYÚSCULAS, como normTexto del servidor. */
const norm = s => String(s == null ? '' : s).normalize('NFD').replace(/[̀-ͯ]/g, '').toUpperCase().trim();
const reducido = matchMedia('(prefers-reduced-motion: reduce)').matches;
if (document.startViewTransition && !reducido) document.documentElement.classList.add('con-vt');
/** Preferencias del navegador (seg.usuario, seg.modo, seg.tipo). Sin almacenamiento no pasa nada. */
const LS = {
  get: k => { try { return localStorage.getItem(k) || ''; } catch (e) { return ''; } },
  set: (k, v) => { try { localStorage.setItem(k, v); } catch (e) { /* sin almacenamiento */ } }
};

/**
 * Copia de limpiarParaEnvio (Logica.gs): el servidor manda null/undefined como '' y los números no finitos como ''.
 * El DEMO pasa por aquí para que ninguna de sus funciones se aparte de lo que de verdad llega.
 */
function limpiarParaEnvio(v) {
  if (v === null || v === undefined) return '';
  if (typeof v === 'number') return isFinite(v) ? v : '';
  if (Array.isArray(v)) return v.map(limpiarParaEnvio);
  if (Object.prototype.toString.call(v) === '[object Date]') return isNaN(v.getTime()) ? '' : v.toISOString();
  if (typeof v === 'object') { const o = {}; Object.keys(v).forEach(k => { o[k] = limpiarParaEnvio(v[k]); }); return o; }
  return v;
}

/* ============ Puente con Apps Script. Abierto como archivo, usa el DEMO del final ============ */
const EN_APPS_SCRIPT = typeof google !== 'undefined' && google.script && google.script.run;

function llamar(fn, ...args) {
  if (EN_APPS_SCRIPT) {
    return new Promise((res, rej) => google.script.run
      .withSuccessHandler(res)
      .withFailureHandler(e => rej(new Error(e.message || e)))[fn](...args));
  }
  if (!DEMO[fn]) return Promise.reject(new Error('El modo de demostración no tiene ' + fn + '.'));
  // Limpia como el servidor y copia, como google.script.run: tocar la respuesta no cambia el DEMO.
  return new Promise(res => res(DEMO[fn](...args))).then(x => JSON.parse(JSON.stringify(limpiarParaEnvio(x))));
}

/* ============ Estado global ============ */
const S = {
  boot: null,       // adaptarBoot(bootstrap())
  hoy: '',          // ISO, de bootstrap().hoy (zona del libro, no la del navegador)
  reglas: null,     // bootstrap().reglas
  usuario: '',      // texto exacto del catálogo ('MAGALY'); '' = sin elegir
  modo: 'claro',
  seccion: 'tablero',
  tablero: null     // getTablero()
};

/* ============ Adaptadores (MAPEO-SERVIDOR.md §0) ============ */
const PARTICULAS = { DE: 1, DEL: 1, Y: 1 };
/** 'ROSA ELENA QUISPE HUAMÁN' -> 'Rosa Elena Quispe Huamán'. Solo para mostrar. */
function nombreBonito(txt) {
  return String(txt || '').trim().toLowerCase().split(/\s+/).filter(Boolean)
    .map((w, i) => i && PARTICULAS[norm(w)] ? w : w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
}
/** '987654321' -> '987 654 321'. Se muestra con espacios y se envía sin ellos. */
function telBonito(tel) {
  const d = String(tel || '').replace(/\D/g, '');
  return d.length === 9 ? d.replace(/(\d{3})(\d{3})(\d{3})/, '$1 $2 $3') : String(tel || '');
}
/** 'Dra. ALEJANDRA LA TORRE MATUK' -> 'Dra. La Torre'; 'Dr. ELÍ FABRIZIO CABANILLAS HUALPA' -> 'Dr. Cabanillas'. */
function medicoCorto(m) {
  const p = String(m || '').trim().split(/\s+/);
  if (p.length < 3) return String(m || '');
  const titulo = /^dra?\.?$/i.test(p[0]) ? p[0] : '';
  const nombres = titulo ? p.slice(1) : p;
  let i = Math.max(0, nombres.length - 2);
  const apellido = [nombres[i]];
  while (i > 0 && /^(LA|DE|DEL|LOS|LAS)$/i.test(nombres[i - 1])) apellido.unshift(nombres[--i]);
  const bonito = apellido.map(w => w.charAt(0) + w.slice(1).toLowerCase()).join(' ');
  return (titulo ? titulo + ' ' : '') + bonito;
}
/** 'DR. ELI CABANILLAS' -> el médico de la lista cuyo nombre contiene ELI y CABANILLAS. '' si el usuario no es médico. */
function medicoDeUsuario(u, medicos) {
  const t = norm(u).split(/[^A-Z]+/).filter(Boolean);
  if (!t.length || (t[0] !== 'DR' && t[0] !== 'DRA')) return '';
  const resto = t.slice(1);
  return (medicos || []).find(m => { const n = norm(m); return resto.every(x => n.includes(x)); }) || '';
}
function adaptarBoot(b) {
  return {
    hoy: b.hoy,
    usuarios: (b.usuarios || []).map(u => ({ v: u, l: nombreBonito(u), rol: /^DRA?\b/.test(norm(u)) ? 'Médico' : 'Asesora', med: medicoDeUsuario(u, b.medicos) })),
    medicos: (b.medicos || []).map(m => ({ k: m, full: m, short: medicoCorto(m) })),
    doctores: b.doctores || [],
    especialidades: b.especialidades || [],
    procedimientos: b.procedimientos || [],
    tratamientos: b.tratamientos || [],
    marcas: b.marcas || {},
    reglas: b.reglas || {}
  };
}

/* ============ Shell ============ */
const yo = () => (S.boot && S.boot.usuarios.find(u => u.v === S.usuario)) || null;

function aplicarModo() {
  document.documentElement.dataset.modo = S.modo;
  const oscuro = S.modo === 'oscuro';
  $$('.js-tema').forEach(b => {
    b.querySelector('i').className = oscuro ? 'ph ph-sun' : 'ph ph-moon';
    const t = b.querySelector('span');
    if (t) t.textContent = oscuro ? 'Modo claro' : 'Modo oscuro';
  });
}

function pintarSaludo() {
  const u = yo();
  $('#saludo').textContent = !u ? 'Buenos días' : u.rol === 'Médico' ? 'Buenos días, doctor ' + u.l.split(' ').pop() : 'Buenos días, ' + u.l;
}

function pintarUsuarios() {
  const html = '<option value="">— Elija —</option>' + S.boot.usuarios.map(u => `<option value="${esc(u.v)}">${esc(u.l)}</option>`).join('');
  $$('.js-usuario').forEach(sel => { sel.innerHTML = html; sel.value = S.usuario; });
}

/** Los dos selectores (menú y barra del celular) dicen siempre lo mismo: si discreparan, se atribuiría a quien no fue. */
function elegirUsuario(v) {
  S.usuario = v;
  LS.set('seg.usuario', v);
  $$('.js-usuario').forEach(sel => { sel.value = v; });
  pintarSaludo();
}

/** Ningún guardado sale sin «¿Quién es usted?». */
function exigirUsuario() {
  if (S.usuario) return true;
  avisar('Elija quién es usted.');
  const sel = $$('.js-usuario').find(s => s.offsetParent);
  if (sel) sel.focus();
  return false;
}

/* Cada pantalla puede definir mostrar(); se llama al entrar en ella. Las llenan las tareas siguientes. */
const VISTAS = { tablero: {}, registro: {}, pacientes: {}, indicadores: {} };
function ir(sec, sinAnim) {
  if (!VISTAS[sec]) sec = 'tablero';
  const cambiar = () => {
    S.seccion = sec;
    $$('[data-sec]').forEach(b => { if (b.dataset.sec === sec) b.setAttribute('aria-current', 'page'); else b.removeAttribute('aria-current'); });
    Object.keys(VISTAS).forEach(k => { $('#v-' + k).hidden = k !== sec; });
    if (VISTAS[sec].mostrar) VISTAS[sec].mostrar();
    window.scrollTo(0, 0);
  };
  if (!sinAnim && !reducido && document.startViewTransition) document.startViewTransition(cambiar); else cambiar();
}
document.addEventListener('click', e => { const b = e.target.closest('[data-sec]'); if (b) ir(b.dataset.sec); });

/** Pastilla deslizante: mide el botón activo del segmentado. */
function pastilla(seg, instant) {
  if (!seg) return;
  const pl = seg.querySelector('.pastilla'), on = seg.querySelector('[aria-pressed="true"],[aria-selected="true"]');
  if (!pl || !on) return;
  if (instant) pl.style.transition = 'none';
  pl.style.width = on.offsetWidth + 'px'; pl.style.transform = `translateX(${on.offsetLeft}px)`;
  if (instant) { void pl.offsetWidth; pl.style.transition = ''; }
}

/** Aviso abajo. Con `accion` ({ texto, fn }) muestra un botón (Deshacer) y dura 8 segundos. */
function avisar(texto, accion) {
  const a = $('#aviso'), b = a.querySelector('button');
  a.querySelector('span').textContent = texto;
  b.hidden = !accion;
  b.textContent = accion ? accion.texto : '';
  avisar.accion = accion || null;
  a.classList.add('ver');
  clearTimeout(avisar.t);
  avisar.t = setTimeout(() => { a.classList.remove('ver'); avisar.accion = null; }, accion ? 8000 : 3500);
}
$('#aviso button').addEventListener('click', () => {
  const ac = avisar.accion;
  avisar.accion = null;
  $('#aviso').classList.remove('ver');
  if (ac) ac.fn();
});

/**
 * Copia al portapapeles y avisa. En Apps Script la página vive dentro de un iframe
 * que a veces bloquea navigator.clipboard: por eso el plan B con execCommand.
 */
async function copiar(texto) {
  let ok = false;
  try {
    if (navigator.clipboard && window.isSecureContext) { await navigator.clipboard.writeText(texto); ok = true; }
  } catch (e) { /* se intenta el plan B */ }
  if (!ok) {
    const t = document.createElement('textarea');
    t.value = texto;
    t.setAttribute('readonly', '');
    t.style.position = 'fixed';
    t.style.opacity = '0';
    document.body.appendChild(t);
    t.select();
    try { ok = document.execCommand('copy'); } catch (e) { ok = false; }
    t.remove();

async function iniciar() {
  S.modo = LS.get('seg.modo') || (matchMedia('(prefers-color-scheme: dark)').matches ? 'oscuro' : 'claro');
  aplicarModo();
  $$('.js-tema').forEach(b => b.addEventListener('click', () => {
    S.modo = S.modo === 'oscuro' ? 'claro' : 'oscuro';
    LS.set('seg.modo', S.modo);
    aplicarModo();
  }));
  $$('.js-usuario').forEach(sel => sel.addEventListener('change', e => elegirUsuario(e.target.value)));
  addEventListener('resize', () => $$('.seg').forEach(s => pastilla(s)));
  if (document.fonts) document.fonts.ready.then(() => $$('.seg').forEach(s => pastilla(s, true)));
  ir('tablero', true);
  let b;
  try {
    b = await llamar('bootstrap');
  } catch (e) {
    $$('.cargando').forEach(p => { p.textContent = 'No se pudo iniciar: ' + e.message; });
    return;
  }
  S.boot = adaptarBoot(b);
  S.hoy = S.boot.hoy;
  S.reglas = S.boot.reglas;
  // Sin usuario por omisión: solo se recupera el recordado si sigue en el catálogo.
  const recordado = LS.get('seg.usuario');
  S.usuario = S.boot.usuarios.some(u => u.v === recordado) ? recordado : '';
  pintarUsuarios();
  pintarSaludo();
}

        cifras: { porContactar: col.POR_CONTACTAR.length, agendados: col.AGENDADO.length, enTratamiento: col.EN_TRATAMIENTO.length,
          completadosMes: col.COMPLETADO.length, cerradosMes: cerrados.length, hechosHoy: hechosEquipo, hechosHoyPor: Object.assign({}, hechosPor) } };
    },

    registrarResultado,

    anularResultado: x => {
      exigir(x, true);
      const id = String(x.id || '').trim();
      if (id.indexOf('SEG-') !== 0) throw new Error('Aquí solo se anulan resultados de seguimiento (SEG-…).');
      const s = seguimientos.find(y => y.ID === id);
      if (!s) throw new Error('No encontré ' + id + '.');
      if (s.ANULADO) throw new Error(id + ' ya estaba anulado.');
      const mismoSeg = seguimientos.filter(y => !y.ANULADO && y.DNI === s.DNI && mismo(y.ESPECIALIDAD, s.ESPECIALIDAD) && y.REFERENCIA === s.REFERENCIA);
      if (s.RESULTADO !== 'FALLECIÓ' && mismoSeg[mismoSeg.length - 1] !== s) throw new Error('Solo se puede anular el último resultado de este seguimiento.');
      s.ANULADO = 'SÍ';
      s.MOTIVO_ANULACION = String(x.motivo).trim();
      restaurar(fotos[id]);
      delete fotos[id];
      return { ok: true };
    },

    getPaciente: dni => {
      const k = dniDe(dni), propias = citas.filter(c => c.DNI === k);
      const sus = series.filter(s => s.DNI === k).map(comoSerie);
      return {
        dni: k, nombre: sus.length ? sus[0].NOMBRE : propias.length ? propias[propias.length - 1].NOMBRE : '',
        series: sus, citas: propias,
        indicaciones: indicaciones.filter(i => i.DNI === k),
        porConfirmar: porConfirmar.filter(i => i.candidatos.some(c => c.dni === k)),
        seguimientos: seguimientos.filter(s => s.DNI === k),
        registros: registros.filter(r => r.DNI === k).map(r => {
          const ss = sesionesDe(r.ID);
          const estado = r.ANULADO ? 'ANULADO' : ss.length >= r.SESIONES ? 'COMPLETO' : ss.length ? 'EN CURSO' : 'COTIZADO';
          return { ID: r.ID, FECHA: r.FECHA, TIPO: r.TIPO, TEXTO: textoRegistro(r), DOCTOR: r.DOCTOR, ASESORA: r.ASESORA, SESIONES: r.SESIONES,
            ESTADO: estado, MOTIVO_ANULACION: r.MOTIVO_ANULACION, sesiones: ss.map(s => ({ ID: s.ID, NUMERO: s.NUMERO, FECHA: s.FECHA, ASESORA: s.ASESORA })) };
        }),
        altas: altas.filter(a => a.DNI === k).map(a => ({ ID: a.ID, FECHA: a.FECHA, ESPECIALIDAD: a.ESPECIALIDAD, DOCTOR: a.DOCTOR,
          REGISTRADO_POR: a.REGISTRADO_POR, ANULADO: !!a.ANULADO, MOTIVO_ANULACION: a.MOTIVO_ANULACION, VIGENTE: vigente(k, a.ESPECIALIDAD) === a })),
        fallecido: muertos[k] || null,
        telefonos: telefonosDe(k),
        telefonosDescartados: descartadosDe(k)
      };
    },

    buscar: q => {
      const n = norm(q), d = dniDe(q).replace(/\s/g, '');
      if (n.length < 3) return [];
      const out = [], vistos = {};
      for (let i = citas.length - 1; i >= 0 && out.length < 20; i--) {
        const c = citas[i];
        if (vistos[c.DNI]) continue;
        if ((/\d/.test(d) && c.DNI.indexOf(d) === 0) || norm(c.NOMBRE).includes(n)) { vistos[c.DNI] = 1; out.push({ DNI: c.DNI, NOMBRE: c.NOMBRE }); }
      }
      return out;
    },

    buscarPacienteRegistro: dni => {
      const k = dniDe(dni), muerto = muertos[k] || null;
      const hechas = citas.filter(c => c.DNI === k && c.ESTADO === 'REALIZADO');
      if (!k || !hechas.length) return { encontrado: false, fallecido: muerto };
      const u = hechas[hechas.length - 1], d = doctores.find(x => x.sofdoc && mismo(x.sofdoc, u.MEDICO));
      return { encontrado: true, nombre: u.NOMBRE, telefonos: telefonosDe(k), ultimaFecha: u.FECHA, ultimoMedico: u.MEDICO, doctor: d ? d.doctor : '',
        especialidades: [...new Set(hechas.map(c => c.ESPECIALIDAD))].sort().map(e => ({ especialidad: e, alta: !!vigente(k, e) })), fallecido: muerto };
    },

    guardarRegistro: x => {
      const quien = exigir(x);
      const dni = dniDe(x.dni).replace(/[\s.\-]/g, '');
      if (!/^\d{8}$/.test(dni) && !/^[A-Z0-9]{9,12}$/.test(dni)) throw new Error('El DNI debe tener 8 dígitos (o el carné de extranjería, de 9 a 12 caracteres).');
      const nombre = String(x.nombre || '').trim().toUpperCase();
      if (!nombre) throw new Error('Falta el nombre del paciente.');
      const contacto = String(x.contacto || '').trim();
      if (!contacto) throw new Error('Falta el teléfono o usuario.');
      const fecha = String(x.fecha || '').slice(0, 10);
      if (!fecha) throw new Error('Falta la fecha.');
      if (fecha > hoy) throw new Error('La fecha no puede ser futura.');
      const doc = doctorDe(x.doctor);
      if (!doc) throw new Error('Elija el doctor de la lista.');
      const procs = (Array.isArray(x.procedimientos) ? x.procedimientos : []).concat(x.procedimiento ? [x.procedimiento] : []).map(p => String(p).trim()).filter(Boolean);
      const trat = String(x.tratamiento || '').trim();
      if (!procs.length && !trat) throw new Error('Elija un procedimiento, un tratamiento o ambos.');
      const base = { FECHA: fecha, ASESORA: quien, DOCTOR: doc.doctor, NOMBRE: nombre, DNI: dni, CONTACTO: contacto, MARCA: '', ANULADO: '', MOTIVO_ANULACION: '' };
      const filas = [];
      procs.forEach(p => {
        const p1 = procedimientos.find(y => mismo(y, p));
        if (!p1) throw new Error('El procedimiento «' + p + '» no está en CATALOGOS.');
        if (!filas.some(f => f.DETALLE === p1)) filas.push(Object.assign({}, base, { TIPO: 'PROCEDIMIENTO', DETALLE: p1, SESIONES: 1 }));
      });
      if (trat) {
        const t1 = tratamientos.find(y => mismo(y, trat));
        if (!t1) throw new Error('El tratamiento «' + trat + '» no está en CATALOGOS.');
        const n = Number(x.sesiones);
        if (!(n >= 1 && n <= 20 && Math.floor(n) === n)) throw new Error('Indique cuántas sesiones (de 1 a 20).');
        const lista = marcas[norm(t1)] || [];
        const marca = lista.find(m => mismo(m, x.marca)) || '';
        if (lista.length && !marca) throw new Error('Elija la marca de ' + t1 + ': ' + lista.join(' o ') + '.');
        if (!lista.length && String(x.marca || '').trim()) throw new Error(t1 + ' no lleva marca.');
        filas.push(Object.assign({}, base, { TIPO: 'HIERRO', DETALLE: t1, MARCA: marca, SESIONES: n }));
      }
      if (!x.confirmado) {
        for (const f of filas) {
          const dup = registros.filter(r => !r.ANULADO && r.DNI === f.DNI && r.TIPO === f.TIPO && mismo(r.DETALLE, f.DETALLE) && Math.abs(entre(r.FECHA, f.FECHA)) <= 7).pop();
          if (dup) return { ok: false, duplicado: { ID: dup.ID, FECHA: dup.FECHA, TEXTO: textoRegistro(dup) } };
        }
      }
      const cuando = ahora();
      filas.forEach(f => {
        f.ID = siguiente(registros, 'REG');
        f.FECHA_HORA = cuando;
        registros.push(f);
        const t = reg(f);
        tarjetas.push(ubicar(t, t.ESTADO === 'PENDIENTE' ? 'POR_CONTACTAR' : ''));
        f.TEXTO = textoRegistro(f);
      });
      return { ok: true, registros: filas };
    },

    getRegistrosHoy: () => registros.filter(r => r.FECHA_HORA.startsWith(hoy)).map(r => ({ ID: r.ID, HORA: r.FECHA_HORA.slice(11, 16),
      ASESORA: r.ASESORA, NOMBRE: r.NOMBRE, DNI: r.DNI, TEXTO: textoRegistro(r), ANULADO: !!r.ANULADO, MOTIVO_ANULACION: r.MOTIVO_ANULACION }))
      .concat(altas.filter(a => a.FECHA_HORA.startsWith(hoy)).map(a => ({ ID: a.ID, HORA: a.FECHA_HORA.slice(11, 16), ASESORA: a.REGISTRADO_POR,
        NOMBRE: (citas.find(c => c.DNI === a.DNI) || {}).NOMBRE || '', DNI: a.DNI, TEXTO: 'Alta médica · ' + a.ESPECIALIDAD + ' · ' + a.DOCTOR,
        ANULADO: !!a.ANULADO, MOTIVO_ANULACION: a.MOTIVO_ANULACION })))
      .sort((a, b) => a.HORA < b.HORA ? 1 : a.HORA > b.HORA ? -1 : (a.ID < b.ID ? 1 : -1)),

    anularRegistro: x => {
      exigir(x, true);
      const r = regPorId(String(x.id || '').trim());
      if (!r) throw new Error('No encontré ' + x.id + '.');
      if (r.ANULADO) throw new Error(r.ID + ' ya estaba anulado.');
      r.ANULADO = 'SÍ';
      r.MOTIVO_ANULACION = String(x.motivo).trim();
      tarjetas.filter(t => t.ID_REGISTRO === r.ID).forEach(t => { t.ESTADO_REGISTRO = 'ANULADO'; t.COLUMNA = ''; });
      return { ok: true };
    },

    marcarSesion: x => {
      const quien = exigir(x);
      const r = regPorId(String(x.id || '').trim());
      if (!r) throw new Error('No encontré ese registro. Recargue la página.');
      if (r.ANULADO) throw new Error('Ese registro está anulado.');
      const validas = sesionesDe(r.ID), f = String(x.fecha || '').slice(0, 10);
      if (validas.length >= r.SESIONES) throw new Error('Ese tratamiento ya tiene todas sus sesiones.');
      if (!f) throw new Error('Falta la fecha de la sesión.');
      if (f > hoy) throw new Error('La fecha no puede ser futura.');
      if (f < r.FECHA) throw new Error('La sesión no puede ser anterior al registro.');
      if (validas.length && f < validas[validas.length - 1].FECHA) throw new Error('La sesión no puede ser anterior a la sesión previa.');
      const s = { ID: siguiente(sesiones, 'SES'), FECHA_HORA: ahora(), ID_REGISTRO: r.ID, NUMERO: validas.length + 1, FECHA: f, ASESORA: quien,
        NOTA: String(x.nota || '').trim(), ANULADO: '', MOTIVO_ANULACION: '' };
      fotos[s.ID] = foto(r.DNI, quien, 1, false);
      sesiones.push(s);
      sumarHecho(quien, 1, false);
      let t = tarjetas.find(y => y.ID_REGISTRO === r.ID);
      if (!t) tarjetas.push(t = ubicar(reg(r), ''));
      trasSesion(t, r);
      return { ok: true, sesion: s, completo: s.NUMERO >= r.SESIONES };
    },

    anularSesion: x => {
      exigir(x, true);
      const s = sesiones.find(y => y.ID === String(x.id || '').trim());
      if (!s) throw new Error('No encontré la sesión ' + x.id + '.');
      if (s.ANULADO) throw new Error('La sesión ' + s.ID + ' ya estaba anulada.');
      const propias = sesionesDe(s.ID_REGISTRO);
      if (propias[propias.length - 1] !== s) throw new Error('Solo se puede anular la última sesión del tratamiento.');
      s.ANULADO = 'SÍ';
      s.MOTIVO_ANULACION = String(x.motivo).trim();
      if (fotos[s.ID]) { restaurar(fotos[s.ID]); delete fotos[s.ID]; } else {
        const t = tarjetas.find(y => y.ID_REGISTRO === s.ID_REGISTRO);
        if (t) trasSesion(t, regPorId(s.ID_REGISTRO));
      }
      return { ok: true };
    },

    darDeAlta: x => {
      const quien = exigir(x);
      const dni = dniDe(x.dni), hechas = citas.filter(c => c.DNI === dni && c.ESTADO === 'REALIZADO' && mismo(c.ESPECIALIDAD, x.especialidad));
      if (!dni) throw new Error('Falta el DNI del paciente.');
      if (!hechas.length) throw new Error('Ese paciente no tiene consultas realizadas en ' + String(x.especialidad || '').toUpperCase() + '.');
      const doc = doctorDe(x.doctor);
      if (!doc) throw new Error('Elija el doctor que da el alta.');
      const f = String(x.fecha || '').slice(0, 10), esp = hechas[0].ESPECIALIDAD;
      if (!f) throw new Error('Falta la fecha del alta.');
      if (f > hoy) throw new Error('La fecha no puede ser futura.');
      if (f < hechas[hechas.length - 1].FECHA) throw new Error('El alta no puede ser anterior a la última consulta.');
      if (vigente(dni, esp)) throw new Error('Ese paciente ya tiene un alta vigente en ' + esp + '.');
      const a = { ID: siguiente(altas, 'ALT'), FECHA_HORA: ahora(), FECHA: f, DNI: dni, ESPECIALIDAD: esp, DOCTOR: doc.doctor, REGISTRADO_POR: quien,
        NOTA: String(x.nota || '').trim(), ANULADO: '', MOTIVO_ANULACION: '' };
      fotos[a.ID] = foto(dni, quien, 1, false);
      altas.push(a);
      sumarHecho(quien, 1, false);
      const s = serie(dni, esp);
      if (s) s.ESTADO = 'ALTA';
      let t = tarjetas.find(y => y.DNI === dni && !y.ID_REGISTRO && mismo(y.ESPECIALIDAD, esp));
      if (!t) tarjetas.push(t = s || reev({ DNI: dni, ESPECIALIDAD: esp, NOMBRE: hechas[0].NOMBRE, ULTIMA_CITA: hechas[hechas.length - 1].FECHA, ESTADO: 'ALTA' }));
      ubicar(t, f.slice(0, 7) === hoy.slice(0, 7) ? 'COMPLETADO' : '', 'Alta médica · ' + doc.doctor, f);
      return { ok: true, alta: a };
    },

    anularAlta: x => {
      exigir(x, true);
      const id = String(x.id || '').trim();
      if (id.indexOf('ALT-') !== 0) throw new Error('Esa alta viene de un descarte antiguo; no se puede anular desde aquí.');
      const a = altas.find(y => y.ID === id);
      if (!a) throw new Error('No encontré ' + id + '.');
      if (a.ANULADO) throw new Error(id + ' ya estaba anulado.');
      a.ANULADO = 'SÍ';
      a.MOTIVO_ANULACION = String(x.motivo).trim();
      if (fotos[id]) { restaurar(fotos[id]); delete fotos[id]; } else {
        const t = tarjetas.find(y => y.DNI === a.DNI && !y.ID_REGISTRO && mismo(y.ESPECIALIDAD, a.ESPECIALIDAD) && y.COLUMNA === 'COMPLETADO');
        if (t) t.COLUMNA = '';
      }
      return { ok: true };
    },

    confirmarEmparejamiento: x => {
      exigir(x);
      const dni = dniDe(x.dni);
      if (!dni) throw new Error('Falta el DNI.');
      const i = porConfirmar.find(y => y.ID === x.id);
      if (!i) throw new Error('No encontré la indicación ' + x.id + '.');
      porConfirmar = porConfirmar.filter(y => y !== i);
      indicaciones.push({ ID: i.ID, FECHA: i.FECHA, TIPO: i.TIPO, DETALLE: i.DETALLE, CANTIDAD: 1, MEDICO_SOLICITANTE: '', ASESORA: '', NOMBRE: i.NOMBRE,
        TELEFONO: i.TELEFONO, ESTADO: 'COTIZÓ', OBSERVACIONES: '', DNI: dni, EMPAREJAMIENTO: 'CONFIRMADO', ORIGEN: '' });
      tarjetas.concat(series).filter(t => t.DNI === dni && !t.TELEFONOS).forEach(t => {
        t.TELEFONOS = i.TELEFONO;
        if ('SIN_CONTACTO' in t) t.SIN_CONTACTO = false;
      });
      return { ok: true };
    },

    getKpi: () => ({
      cohortes: [
        { COHORTE: '2026-06', ESPECIALIDAD: 'HEMATOLOGÍA', MEDICO: ELI, ETAPA: 1, ELEGIBLES: 40, VOLVIERON: 15, EN_CURSO: 0, ALTAS: 0 },
        { COHORTE: '2026-06', ESPECIALIDAD: 'HEMATOLOGÍA', MEDICO: ELI, ETAPA: 2, ELEGIBLES: 15, VOLVIERON: 8, EN_CURSO: 0, ALTAS: 0 },
        { COHORTE: '2026-06', ESPECIALIDAD: 'HEMATOLOGÍA', MEDICO: ELI, ETAPA: 3, ELEGIBLES: 8, VOLVIERON: 5, EN_CURSO: 0, ALTAS: 0 },
        { COHORTE: '2026-07', ESPECIALIDAD: 'HEMATOLOGÍA', MEDICO: KAREN, ETAPA: 1, ELEGIBLES: 52, VOLVIERON: 17, EN_CURSO: 0, ALTAS: 0 },
        { COHORTE: '2026-07', ESPECIALIDAD: 'HEMATOLOGÍA', MEDICO: KAREN, ETAPA: 2, ELEGIBLES: 17, VOLVIERON: 9, EN_CURSO: 0, ALTAS: 2 },
        { COHORTE: '2026-07', ESPECIALIDAD: 'REUMATOLOGÍA', MEDICO: HANAMPA, ETAPA: 1, ELEGIBLES: 6, VOLVIERON: 2, EN_CURSO: 0, ALTAS: 0 },
        { COHORTE: '2026-08', ESPECIALIDAD: 'HEMATOLOGÍA', MEDICO: ELI, ETAPA: 1, ELEGIBLES: 48, VOLVIERON: 12, EN_CURSO: 20, ALTAS: 0 },
        { COHORTE: '2026-09', ESPECIALIDAD: 'HEMATOLOGÍA', MEDICO: KAREN, ETAPA: 1, ELEGIBLES: 0, VOLVIERON: 0, EN_CURSO: 30, ALTAS: 0 }
      ],
      indicaciones: [
        { MES: '2026-08', TIPO: 'HIERRO', DETALLE: 'HIERRO', GRUPO: 'HIERRO', MEDICO: ELI, INDICADAS: 30, ACEPTADAS: 14, COMPLETADAS: 10 },
        { MES: '2026-08', TIPO: 'PROCEDIMIENTO', DETALLE: 'AMO + BIOPSIA', GRUPO: 'AMO + BIOPSIA', MEDICO: KAREN, INDICADAS: 9, ACEPTADAS: 1, COMPLETADAS: 1 },
        { MES: '2026-08', TIPO: 'PROCEDIMIENTO', DETALLE: 'BIOPSIA DE MÉDULA + AMO', GRUPO: 'AMO + BIOPSIA', MEDICO: ELI, INDICADAS: 4, ACEPTADAS: 2, COMPLETADAS: 2 },
        { MES: '2026-09', TIPO: 'HIERRO', DETALLE: 'HIERRO', GRUPO: 'HIERRO', MEDICO: KAREN, INDICADAS: 25, ACEPTADAS: 13, COMPLETADAS: 13 },
        { MES: '2026-09', TIPO: 'PROCEDIMIENTO', DETALLE: 'SANGRIA', GRUPO: 'SANGRÍA', MEDICO: ELI, INDICADAS: 6, ACEPTADAS: 5, COMPLETADAS: 4 }
      ],
      recuperacion: [
        { MES: '2026-09', RESPONSABLE: 'MAGALY', ESPECIALIDAD: 'HEMATOLOGÍA', MEDICO: ELI, VOLVIO: 1, DIAS: 6, FECHA_RETORNO: '2026-09-16' },
        { MES: '2026-09', RESPONSABLE: 'MAGALY', ESPECIALIDAD: 'HEMATOLOGÍA', MEDICO: KAREN, VOLVIO: 0, DIAS: '', FECHA_RETORNO: '' },
        { MES: '2026-09', RESPONSABLE: 'RACHEL', ESPECIALIDAD: 'REUMATOLOGÍA', MEDICO: HANAMPA, VOLVIO: 1, DIAS: 12, FECHA_RETORNO: '2026-09-22' },
        { MES: '2026-09', RESPONSABLE: 'DR. ELI CABANILLAS', ESPECIALIDAD: 'HEMATOLOGÍA', MEDICO: ELI, VOLVIO: 1, DIAS: 9, FECHA_RETORNO: '2026-09-30' }
      ],
      motivos: [{ MOTIVO: 'SE ATIENDE EN OTRO LUGAR', N: 4 }, { MOTIVO: 'NÚMERO EQUIVOCADO', N: 2 }, { MOTIVO: 'FALLECIÓ', N: 1 }],
      campanas: [
        { MES: '2026-08', MEDICO: ELI, CANAL: 'FACEBOOK ADS', CAMPANA: 'LAB-001', NUEVOS: 20, EN_CURSO: 0, VOLVIERON: 9 },
        { MES: '2026-08', MEDICO: KAREN, CANAL: 'FACEBOOK ADS', CAMPANA: 'Sin campaña', NUEVOS: 15, EN_CURSO: 0, VOLVIERON: 4 },
        { MES: '2026-08', MEDICO: ELI, CANAL: 'WSSP DIRECTO', CAMPANA: 'Sin campaña', NUEVOS: 10, EN_CURSO: 0, VOLVIERON: 6 },
        { MES: '2026-09', MEDICO: ELI, CANAL: 'GOOGLE', CAMPANA: 'Sin campaña', NUEVOS: 8, EN_CURSO: 5, VOLVIERON: 1 },
        { MES: '2026-08', MEDICO: KAREN, CANAL: 'Sin lead en el CRM', CAMPANA: 'Sin lead en el CRM', NUEVOS: 6, EN_CURSO: 0, VOLVIERON: 2 }
      ],
      sinCandidato: [{ ID: 'IND-0120', FECHA: '2026-05-04', TIPO: 'HIERRO', NOMBRE: 'PAOLA RIVERA', TELEFONO: '956789012' }],
      meta: reglas.metaRetorno
    }),

    getResumen: () => {
      const r = (MES, MEDICO, v) => ({ MES, MEDICO, NUEVOS: v[0], NUEVOS_NO: v[1], NUEVOS_CURSO: v[2], NUEVOS_ALTA: v[12] || 0, CONTROL: v[3],
        CONTROL_NO: v[4], CONTROL_CURSO: v[5], CONTROL_ALTA: v[13] || 0, HIERRO: v[6], HIERRO_NO: v[7], HIERRO_COMPLETO: v[14] || 0,
        PROC: v[8], PROC_NO: v[9], SEGUIMIENTOS: v[10], RECUPERADOS: v[11] });
      return { hoy, meta: reglas.metaRetorno, medicos: [ELI, KAREN], filas: [
        r('2026-09', ELI, [30, 2, 20, 25, 3, 15, 12, 5, 3, 2, 10, 4]),
        r('2026-08', ELI, [40, 24, 0, 30, 9, 0, 15, 6, 4, 3, 0, 0, 0, 0, 6]),
        r('2026-08', KAREN, [35, 20, 0, 20, 6, 0, 10, 5, 2, 2, 0, 0]),
        r('2026-07', KAREN, [38, 25, 0, 22, 8, 0, 9, 4, 5, 4, 0, 0, 2, 0, 0])
      ] };
    }
  };

  // Envoltorio para las pruebas: cuenta llamadas, guarda los argumentos y puede fallar o tardar a pedido.
  // window.DEMO_FALLAR (puesto antes de cargar, p. ej. con addInitScript) permite que falle hasta bootstrap.
  const demo = { _llamadas: {}, _ultimo: {}, _fallar: Object.assign({}, window.DEMO_FALLAR || {}), _demora: {} };
  Object.keys(api).forEach(fn => {
    demo[fn] = (...args) => {
      demo._llamadas[fn] = (demo._llamadas[fn] || 0) + 1;
      demo._ultimo[fn] = clonar(args);
      const correr = () => { if (demo._fallar[fn]) throw new Error(demo._fallar[fn]); return api[fn](...args); };
      if (!demo._demora[fn]) return correr();
      return new Promise((ok, mal) => setTimeout(() => { try { ok(correr()); } catch (e) { mal(e); } }, demo._demora[fn]));
    };
  });
  return demo;
})();

iniciar();
</script>
